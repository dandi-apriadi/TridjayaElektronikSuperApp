name: te_superapp
description: Tridjaya Elektronik SuperApp - ERP Multi-Cabang
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  provider: ^6.1.1

  # Routing
  go_router: ^14.2.0

  # HTTP & Networking
  dio: ^5.4.3+1
  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Local DB (offline-first)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.4
  path: ^1.9.0

  # UI & Charts
  fl_chart: ^0.68.0
  table_calendar: ^3.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  badges: ^3.1.2
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  jwt_decoder: ^2.0.1
  connectivity_plus: ^6.0.3
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.13.1
  # flutter_native_splash: ^2.4.0  # DISABLED - causing Gradle build errors

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env

# App Icon Configuration
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21

