version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: te_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-te_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-te_secret_2024}
      POSTGRES_DB: ${DB_NAME:-te_superapp}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-te_admin} -d ${DB_NAME:-te_superapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - te_network

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: te_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - te_network

  # MinIO (S3-compatible storage for photos)
  minio:
    image: minio/minio:latest
    container_name: te_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - te_network

  # Create MinIO bucket on startup
  minio_init:
    image: minio/mc:latest
    container_name: te_minio_init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb local/te-uploads --ignore-existing;
      mc anonymous set public local/te-uploads;
      echo 'MinIO bucket created successfully';
      exit 0;
      "
    networks:
      - te_network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: te_backend
    environment:
      - DATABASE_URL=postgres://${DB_USER:-te_admin}:${DB_PASSWORD:-te_secret_2024}@postgres:5432/${DB_NAME:-te_superapp}
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - S3_BUCKET=te-uploads
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - RUST_LOG=info
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - cargo_cache:/usr/local/cargo/registry
    networks:
      - te_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  cargo_cache:

networks:
  te_network:
    driver: bridge
